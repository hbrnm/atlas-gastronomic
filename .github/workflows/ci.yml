name: CI Pipeline

on:
  push:
    branches: [ main, chore/integrate-agent-skills ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Typecheck, Build and Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Run automated test suite
        run: npm test
        env:
          NODE_ENV: test
          ATLAS_PRIVATE_APP: 'false'
